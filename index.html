<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function(){
      try {
        var t = localStorage.getItem("portfolio-theme") || "dark";
        if (location.search.indexOf("theme=light") !== -1) t = "light";
        if (location.search.indexOf("theme=dark") !== -1) t = "dark";
        document.documentElement.setAttribute("data-theme", t);
        if (t === "dark") document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      } catch(e) {}
    })();
    window.addEventListener('load', function() {
      var p = new URLSearchParams(window.location.search);
      var s = p.get('scroll');
      if (s) {
        var el = document.getElementById(s);
        if (el) {
          window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 48);
        }
      }
    });
  </script>
